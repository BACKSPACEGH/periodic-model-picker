<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Model Periodic Table v1.0.0 — Promo Studio</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    canvas {
      width: 960px;
      height: 540px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.45);
      background: #f8fafc;
    }
  </style>
  <script src="/shared/periodic-table-data.js"></script>
</head>
<body>
  <canvas id="stage" width="1920" height="1080"></canvas>
  <script>
    (() => {
      const canvas = document.getElementById('stage');
      const ctx = canvas.getContext('2d', { alpha: false });
      const DATA = window.GeminiPeriodicTableData;
      const ELEMENTS = DATA.ELEMENTS;
      const BY_SYM = DATA.ELEMENTS_BY_SYMBOL;

      const W = 1920;
      const H = 1080;
      const BPM = 124;
      const BEAT = 60 / BPM;          // 0.48387097s
      const BAR = BEAT * 4;           // 1.93548387s
      const TOTAL_BARS = 31;          // 60.0000s
      const DURATION = TOTAL_BARS * BAR;

      const FONT_SANS = '-apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif';
      const FONT_MONO = '"SF Mono", ui-monospace, Menlo, Monaco, Consolas, monospace';

      // Math & Easing helpers
      const clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
      const lerp = (a, b, t) => a + (b - a) * t;
      const invLerp = (a, b, v) => clamp((v - a) / (b - a));
      const easeOutCubic = (t) => 1 - Math.pow(1 - clamp(t), 3);
      const easeOutQuint = (t) => 1 - Math.pow(1 - clamp(t), 5);
      const easeInOutCubic = (t) => {
        t = clamp(t);
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      };
      const springPop = (t) => {
        t = clamp(t);
        if (t <= 0) return 0;
        if (t >= 1) return 1;
        return 1 - Math.exp(-6.5 * t) * Math.cos(9.5 * t);
      };

      // Rounded rect helper
      function rr(x, y, w, h, r) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, r);
      }

      function fillCard(x, y, w, h, r, fill = '#ffffff', stroke = 'rgba(15,23,42,0.08)', shadowAlpha = 0.085, shadowY = 22, shadowBlur = 54) {
        ctx.save();
        if (shadowAlpha > 0) {
          ctx.shadowColor = `rgba(15, 23, 42, ${shadowAlpha})`;
          ctx.shadowBlur = shadowBlur;
          ctx.shadowOffsetX = 0;
          ctx.shadowOffsetY = shadowY;
        }
        rr(x, y, w, h, r);
        ctx.fillStyle = fill;
        ctx.fill();
        ctx.restore();

        if (stroke) {
          ctx.save();
          rr(x, y, w, h, r);
          ctx.strokeStyle = stroke;
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.restore();
        }
      }

      // Studio light background + subtle architectural grid + optional ambient glow
      function drawStudioBackground(accentColor = 'rgba(59,130,246,0.07)', glowX = 1280, glowY = 520) {
        const grad = ctx.createRadialGradient(W * 0.52, H * 0.44, 80, W * 0.5, H * 0.5, 1180);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.58, '#f5f8fc');
        grad.addColorStop(1, '#eaeff7');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        // Subtle ambient bloom
        if (accentColor) {
          const bloom = ctx.createRadialGradient(glowX, glowY, 30, glowX, glowY, 540);
          bloom.addColorStop(0, accentColor);
          bloom.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = bloom;
          ctx.fillRect(0, 0, W, H);
        }

        // Architectural 48px grid
        ctx.save();
        ctx.strokeStyle = 'rgba(15, 23, 42, 0.032)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = 48; x < W; x += 48) {
          ctx.moveTo(x + 0.5, 0);
          ctx.lineTo(x + 0.5, H);
        }
        for (let y = 48; y < H; y += 48) {
          ctx.moveTo(0, y + 0.5);
          ctx.lineTo(W, y + 0.5);
        }
        ctx.stroke();
        ctx.restore();
      }

      // Corner editorial HUD (matches Antigrative Dashboard V-0.9.1 video style)
      function drawEditorialHUD(t, chapterNum, totalChapters = 9, alpha = 1) {
        if (alpha <= 0.01) return;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.font = `600 14px ${FONT_MONO}`;
        ctx.fillStyle = '#64748b';
        ctx.textBaseline = 'middle';

        // Top-left
        ctx.textAlign = 'left';
        ctx.fillText('MODEL PERIODIC TABLE  /  v1.0.0', 76, 52);

        // Top-right: chapter + SMPTE timecode MM:SS:FF
        const mins = String(Math.floor(t / 60)).padStart(2, '0');
        const secs = String(Math.floor(t % 60)).padStart(2, '0');
        const frames = String(Math.floor((t % 1) * 60)).padStart(2, '0');
        const chapStr = `${String(chapterNum).padStart(2, '0')} / ${String(totalChapters).padStart(2, '0')}    ${mins}:${secs}:${frames}`;
        ctx.textAlign = 'right';
        ctx.fillText(chapStr, W - 76, 52);

        // Bottom-left
        ctx.textAlign = 'left';
        ctx.fillText('GEMINI 4   ·   插件 v1.0.0   ·   CREATED BY MEOW', 76, H - 48);

        // Bottom-right: 124 BPM with beat pulse dot
        const beatPhase = (t / BEAT) % 1;
        const pulse = Math.exp(-5.5 * beatPhase);
        ctx.textAlign = 'right';
        ctx.fillText('124 BPM', W - 76, H - 48);

        ctx.beginPath();
        ctx.arc(W - 154, H - 48, 4 + pulse * 2.2, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(37, 99, 235, ${0.42 + pulse * 0.58})`;
        ctx.fill();

        ctx.restore();
      }

      // Left-column editorial copy block (matches — 01 · 标题 + Heavy Headline + Subtitle)
      function drawLeftEditorial(tagNum, tagLabel, titleLines, descLines, enterProg = 1, x = 116, y = 390) {
        const p = easeOutQuint(enterProg);
        ctx.save();
        ctx.globalAlpha = clamp(enterProg * 1.5);
        ctx.translate(0, (1 - p) * 28);

        // Section tag: — 01 · 标签
        ctx.strokeStyle = '#2563eb';
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + 26, y);
        ctx.stroke();

        ctx.font = `700 18px ${FONT_SANS}`;
        ctx.fillStyle = '#2563eb';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${tagNum}  ·  ${tagLabel}`, x + 38, y);

        // Main headline
        let curY = y + 58;
        ctx.font = `800 62px ${FONT_SANS}`;
        ctx.fillStyle = '#0f172a';
        ctx.textBaseline = 'top';
        for (const line of titleLines) {
          ctx.fillText(line, x, curY);
          curY += 76;
        }

        // Subtitle
        curY += 14;
        ctx.font = `400 22px ${FONT_SANS}`;
        ctx.fillStyle = '#475569';
        for (const d of descLines) {
          ctx.fillText(d, x, curY);
          curY += 34;
        }

        ctx.restore();
      }

      // Draw Periodic Table App Icon (rounded white squircle with H / C / Ar / Sparkle quad)
      function drawAppIcon(cx, cy, size = 112, scale = 1) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(scale, scale);
        const half = size / 2;
        fillCard(-half, -half, size, size, size * 0.24, '#ffffff', 'rgba(15,23,42,0.09)', 0.13, 18, 42);

        const pad = size * 0.14;
        const gap = size * 0.06;
        const cell = (size - pad * 2 - gap) / 2;
        const x0 = -half + pad;
        const y0 = -half + pad;

        const quads = [
          { x: x0, y: y0, bg: '#1e3a5f', border: '#4f92ff', sym: 'H', num: '1', tc: '#eef5ff' },
          { x: x0 + cell + gap, y: y0, bg: '#171923', border: '#334155', sym: '✦', num: '4', tc: '#93c5fd' },
          { x: x0, y: y0 + cell + gap, bg: '#382352', border: '#a86af9', sym: 'C', num: '6', tc: '#f6edff' },
          { x: x0 + cell + gap, y: y0 + cell + gap, bg: '#163d3b', border: '#2dd4bf', sym: 'Ar', num: '18', tc: '#e6fffb' },
        ];
        for (const q of quads) {
          rr(q.x, q.y, cell, cell, cell * 0.24);
          ctx.fillStyle = q.bg;
          ctx.fill();
          ctx.strokeStyle = q.border;
          ctx.lineWidth = Math.max(1.2, size * 0.016);
          ctx.stroke();

          ctx.fillStyle = q.tc;
          ctx.font = `700 ${cell * 0.44}px ${FONT_SANS}`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(q.sym, q.x + cell * 0.5, q.y + cell * 0.56);
        }
        ctx.restore();
      }

      // Draw macOS Arrow Cursor + optional click ripple
      function drawCursor(x, y, clickPulse = 0, rippleProg = -1, accent = '#3b82f6') {
        if (rippleProg >= 0 && rippleProg <= 1) {
          ctx.save();
          const r = lerp(8, 52, easeOutCubic(rippleProg));
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.strokeStyle = accent;
          ctx.globalAlpha = (1 - rippleProg) * 0.65;
          ctx.lineWidth = 3 * (1 - rippleProg * 0.5);
          ctx.stroke();
          ctx.restore();
        }

        ctx.save();
        ctx.translate(x, y);
        const sc = 1 - Math.sin(clamp(clickPulse) * Math.PI) * 0.16;
        ctx.scale(sc, sc);
        ctx.shadowColor = 'rgba(15,23,42,0.28)';
        ctx.shadowBlur = 12;
        ctx.shadowOffsetY = 4;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, 27);
        ctx.lineTo(7.2, 20.5);
        ctx.lineTo(12.2, 31.5);
        ctx.lineTo(16.8, 29.4);
        ctx.lineTo(11.8, 18.5);
        ctx.lineTo(20.5, 18.5);
        ctx.closePath();

        ctx.fillStyle = '#0f172a';
        ctx.fill();
        ctx.lineWidth = 2.2;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();
        ctx.restore();
      }

      // Theme helper for elements
      function getModelTheme(sym) {
        if (sym === 'H') return { accent: '#4f92ff', bg: '#1c3352', pillBg: '#eff6ff', pillBorder: '#93c5fd', pillText: '#1d4ed8', dot: '#3b82f6', title: 'Gemini 4 Hydrogen', sub: 'Everyday help · 日常全能秒回' };
        if (sym === 'C') return { accent: '#a86af9', bg: '#332249', pillBg: '#f5f3ff', pillBorder: '#c4b5fd', pillText: '#6d28d9', dot: '#8b5cf6', title: 'Gemini 4 Carbon', sub: 'Most complex work · 深度复杂推理' };
        if (sym === 'Ar') return { accent: '#2dd4bf', bg: '#163b39', pillBg: '#f0fdfa', pillBorder: '#5eead4', pillText: '#0f766e', dot: '#14b8a6', title: 'Gemini 4 Argon', sub: 'Code and analysis · 代码与严谨分析' };
        const el = BY_SYM[sym] || { name: sym, nameZh: '', z: 0 };
        return { accent: '#94a3b8', bg: '#252834', pillBg: '#f1f5f9', pillBorder: '#cbd5e1', pillText: '#334155', dot: '#64748b', title: `Gemini 4 ${el.name}`, sub: 'Coming soon · 即将推出彩蛋预览', comingSoon: true };
      }

      // Draw the Dark Sleek 118-Element Periodic Table Modal Card
      // Returns geometry lookup `{ tileCenter(sym), cardRect, olderRects }` so cursor & popovers align 100% pixel-accurately!
      function drawPeriodicTableModal(opts = {}) {
        const {
          x = 700,
          y = 140,
          w = 1110,
          h = 780,
          activeSym = 'H',
          thinking = 'High',
          hoverSym = null,
          waveTime = -1,
          showPopover = true,
          activeOtherId = null,
          highlightRingSym = null,
          ringPulse = 0,
        } = opts;

        // Outer ambient white frame + inner obsidian periodic modal (high-contrast luxury look!)
        fillCard(x - 10, y - 10, w + 20, h + 20, 32, 'rgba(255,255,255,0.85)', 'rgba(15,23,42,0.08)', 0.12, 28, 68);
        fillCard(x, y, w, h, 24, '#15171e', 'rgba(255,255,255,0.10)', 0, 0, 0);

        // Top bar: ✦ Model periodic table  |  legend  |  ✕
        ctx.save();
        ctx.font = `600 18px ${FONT_SANS}`;
        ctx.fillStyle = '#e2e8f0';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText('✦  Model periodic table', x + 34, y + 38);

        // Legend in top-right area
        ctx.font = `500 14px ${FONT_SANS}`;
        ctx.fillStyle = '#93c5fd';
        ctx.beginPath();
        ctx.arc(x + w - 260, y + 38, 4.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#cbd5e1';
        ctx.fillText('3 released', x + w - 248, y + 38);

        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(x + w - 148, y + 38, 4.5, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = '#94a3b8';
        ctx.fillText('Coming soon', x + w - 136, y + 38);

        // Close button
        ctx.fillStyle = '#64748b';
        ctx.font = `500 18px ${FONT_SANS}`;
        ctx.fillText('✕', x + w - 36, y + 38);

        // Center hero header inside the periodic table gap (cols 3..12, rows 1..3)
        ctx.font = `700 40px ${FONT_SANS}`;
        ctx.fillStyle = '#f8fafc';
        ctx.textAlign = 'center';
        ctx.fillText('Gemini 4', x + w * 0.45, y + 120);
        ctx.font = `400 15px ${FONT_SANS}`;
        ctx.fillStyle = '#94a3b8';
        ctx.fillText('Select an element model & thinking depth', x + w * 0.45, y + 154);

        // Grid metrics (18 cols, rows 1..7 + gap + rows 9..10)
        const padX = 32;
        const gridTop = y + 74;
        const gap = 5.5;
        const cellW = (w - padX * 2 - gap * 17) / 18;
        const lnGap = 14;
        const availGridH = h - 74 - 76 - lnGap;
        const cellH = Math.min(51, Math.max(34, (availGridH - gap * 8) / 9));

        const tileMap = {};

        const rowY = (r) => {
          if (r <= 7) return gridTop + (r - 1) * (cellH + gap);
          return gridTop + 7 * (cellH + gap) + lnGap + (r - 9) * (cellH + gap);
        };

        // Lanthanide / Actinide placeholder markers at (6,3) and (7,3)
        for (const [r, label] of [[6, '57-71'], [7, '89-103']]) {
          const tx = x + padX + 2 * (cellW + gap);
          const ty = rowY(r);
          rr(tx, ty, cellW, cellH, 8);
          ctx.fillStyle = 'rgba(255,255,255,0.025)';
          ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,255,0.06)';
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.fillStyle = '#64748b';
          ctx.font = `600 10px ${FONT_MONO}`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(label, tx + cellW / 2, ty + cellH / 2);
        }

        // Draw all 118 elements
        for (const el of ELEMENTS) {
          const tx = x + padX + (el.col - 1) * (cellW + gap);
          const ty = rowY(el.row);
          tileMap[el.symbol] = { x: tx, y: ty, w: cellW, h: cellH, cx: tx + cellW / 2, cy: ty + cellH / 2, el };

          const isSelected = !activeOtherId && (activeSym === el.symbol);
          const isHover = hoverSym === el.symbol;

          // Wave shimmer effect in Scene 01
          let shimmer = 0;
          if (waveTime >= 0) {
            const diag = (el.col * 0.055 + el.row * 0.075);
            const d = Math.abs(waveTime - diag);
            if (d < 0.28) shimmer = Math.cos((d / 0.28) * (Math.PI / 2)) * 0.35;
          }

          if (el.released) {
            const c = el.model.colors;
            ctx.save();
            if (isSelected || isHover) {
              ctx.shadowColor = c.tileBorder;
              ctx.shadowBlur = isSelected ? 22 : 14;
            }
            rr(tx, ty, cellW, cellH, 9);
            ctx.fillStyle = isSelected ? c.pillActiveBg : c.tileBg;
            ctx.fill();
            ctx.strokeStyle = c.tileBorder;
            ctx.lineWidth = isSelected ? 2.4 : 1.5;
            ctx.stroke();
            ctx.restore();

            // Atomic number + dot
            ctx.font = `600 10.5px ${FONT_MONO}`;
            ctx.fillStyle = c.tileNumber;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText(String(el.z), tx + 6, ty + 5);

            ctx.beginPath();
            ctx.arc(tx + cellW - 7.5, ty + 9, 2.8, 0, Math.PI * 2);
            ctx.fillStyle = c.dot;
            ctx.fill();

            // Symbol
            ctx.font = `700 20px ${FONT_SANS}`;
            ctx.fillStyle = c.tileText;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(el.symbol, tx + cellW / 2, ty + cellH * 0.62);
          } else {
            rr(tx, ty, cellW, cellH, 8);
            const baseAlpha = isSelected || isHover ? 0.16 : (0.048 + shimmer * 0.18);
            ctx.fillStyle = `rgba(255, 255, 255, ${baseAlpha})`;
            ctx.fill();
            ctx.strokeStyle = isSelected || isHover
              ? 'rgba(226, 232, 240, 0.75)'
              : `rgba(255, 255, 255, ${0.07 + shimmer * 0.25})`;
            ctx.lineWidth = isSelected ? 1.8 : 1;
            ctx.stroke();

            ctx.font = `500 9.5px ${FONT_MONO}`;
            ctx.fillStyle = isSelected ? '#cbd5e1' : 'rgba(148, 163, 184, 0.68)';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText(String(el.z), tx + 5, ty + 4.5);

            ctx.font = `600 17px ${FONT_SANS}`;
            ctx.fillStyle = isSelected || isHover ? '#f8fafc' : `rgba(203, 213, 225, ${0.78 + shimmer * 0.22})`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(el.symbol, tx + cellW / 2, ty + cellH * 0.63);
          }

          // Target highlight ring (for keyboard jump scene)
          if (highlightRingSym === el.symbol && ringPulse > 0) {
            ctx.save();
            const pad = 4 + ringPulse * 8;
            rr(tx - pad, ty - pad, cellW + pad * 2, cellH + pad * 2, 12);
            ctx.strokeStyle = '#2dd4bf';
            ctx.lineWidth = 2.8;
            ctx.globalAlpha = 1 - ringPulse * 0.45;
            ctx.stroke();
            ctx.restore();
          }
        }

        // Bottom Older / Other models bar
        const footerY = y + h - 54;
        ctx.font = `600 12px ${FONT_MONO}`;
        ctx.fillStyle = '#94a3b8';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText('OTHER MODELS', x + padX, footerY);

        const chips = [
          { id: '3.1-pro', label: '3.1 Pro' },
          { id: '3.8-flash', label: '3.8 Flash' },
          { id: 'orchestrator', label: 'Orchestrator' },
          { id: 'claude-sonnet', label: 'Claude Sonnet 4.6' },
          { id: 'claude-opus', label: 'Claude Opus 4.6' },
          { id: 'gpt-oss', label: 'GPT-OSS 120B' },
        ];
        const chipRects = {};
        let cx = x + padX + 122;
        ctx.font = `500 13px ${FONT_SANS}`;
        for (const ch of chips) {
          const cw = ctx.measureText(ch.label).width + 26;
          const chH = 30;
          const isAct = activeOtherId === ch.id;
          rr(cx, footerY - chH / 2, cw, chH, 15);
          ctx.fillStyle = isAct ? 'rgba(59, 130, 246, 0.24)' : 'rgba(255, 255, 255, 0.06)';
          ctx.fill();
          ctx.strokeStyle = isAct ? '#60a5fa' : 'rgba(255, 255, 255, 0.12)';
          ctx.lineWidth = isAct ? 1.6 : 1;
          ctx.stroke();

          ctx.fillStyle = isAct ? '#eff6ff' : '#cbd5e1';
          ctx.textAlign = 'center';
          ctx.fillText(ch.label, cx + cw / 2, footerY);
          chipRects[ch.id] = { x: cx, y: footerY - chH / 2, w: cw, h: chH, cx: cx + cw / 2, cy: footerY };
          cx += cw + 10;
        }

        // Floating Popover Card for activeSym
        let popoverInfo = null;
        if (showPopover && activeSym && tileMap[activeSym] && !activeOtherId) {
          const anchor = tileMap[activeSym];
          const el = anchor.el;
          const theme = getModelTheme(activeSym);
          const pw = el.released ? 316 : 268;
          const ph = el.released ? 168 : 114;

          let px = anchor.cx - pw / 2;
          px = clamp(px, x + 28, x + w - pw - 28);
          let py = anchor.y + anchor.h + 14;
          if (py + ph > y + h - 68) {
            py = anchor.y - ph - 14;
          }

          ctx.save();
          ctx.shadowColor = 'rgba(0, 0, 0, 0.52)';
          ctx.shadowBlur = 34;
          ctx.shadowOffsetY = 14;
          rr(px, py, pw, ph, 18);
          ctx.fillStyle = '#202430';
          ctx.fill();
          ctx.restore();

          rr(px, py, pw, ph, 18);
          ctx.strokeStyle = el.released ? theme.accent : 'rgba(255,255,255,0.18)';
          ctx.lineWidth = 1.6;
          ctx.stroke();

          // Title & atomic badge
          ctx.beginPath();
          ctx.arc(px + 22, py + 28, 5, 0, Math.PI * 2);
          ctx.fillStyle = theme.accent;
          ctx.fill();

          ctx.font = `700 18px ${FONT_SANS}`;
          ctx.fillStyle = '#f8fafc';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          ctx.fillText(`Gemini 4 ${el.name}`, px + 36, py + 28);

          ctx.font = `600 12px ${FONT_MONO}`;
          ctx.fillStyle = '#94a3b8';
          ctx.textAlign = 'right';
          ctx.fillText(`#${el.z} ${el.symbol}`, px + pw - 18, py + 28);

          ctx.font = `400 14px ${FONT_SANS}`;
          ctx.fillStyle = '#cbd5e1';
          ctx.textAlign = 'left';
          if (el.released) {
            ctx.fillText(`${el.model.tagline} · ${el.model.taglineZh}`, px + 20, py + 56);

            // Thinking level label + segmented control
            ctx.font = `600 11.5px ${FONT_MONO}`;
            ctx.fillStyle = '#94a3b8';
            ctx.fillText('THINKING LEVEL', px + 20, py + 90);

            const levels = ['Low', 'Medium', 'High', 'XHigh'];
            const segX = px + 18;
            const segY = py + 108;
            const segW = pw - 36;
            const segH = 38;
            rr(segX, segY, segW, segH, 11);
            ctx.fillStyle = '#141720';
            ctx.fill();

            const itemW = (segW - 8) / levels.length;

              ctx.fillStyle = activeLv ? '#ffffff' : '#94a3b8';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText(lv, lx + lw / 2, ly + lh / 2);

        ctx.restore();

      // Draw Gemini / Antigravity Prompt Input Bar (used in Intro Hook & zoom scenes)

        const h = 128;

        let bx = pillX + pillW + 14;

        ctx.font = `500 14px ${FONT_SANS}`;

        ctx.scale(camScale, camScale);
        ctx.translate(-W / 2, -H / 2 + camY);

        // App window shell (revealed as camera zooms out)

          ctx.save();
          ctx.globalAlpha = zoomProg;
          fillCard(170, 96, 1580, 888, 28, '#fcfdff', 'rgba(15,23,42,0.08)', 0.09, 26, 68);
          // Window traffic lights + title
          const dots = ['#ef4444', '#f59e0b', '#10b981'];
          dots.forEach((c, i) => {
            ctx.beginPath();
            ctx.arc(206 + i * 22, 128, 6, 0, Math.PI * 2);
            ctx.fillStyle = c;
            ctx.fill();
          });
          ctx.font = `500 14px ${FONT_SANS}`;
          ctx.fillStyle = '#64748b';
          ctx.textAlign = 'center';
          ctx.fillText('Gemini 4  ·  Google Antigravity Workspace', W / 2, 128);
          ctx.restore();
        }

        // Hook headline above prompt bar during Bars 0..1.6
        if (localBar < 1.85) {
          const headIn = easeOutQuint(invLerp(0.08, 0.55, localBar));
          const headOut = 1 - easeInOutCubic(invLerp(1.3, 1.8, localBar));
          ctx.save();
          ctx.globalAlpha = headIn * headOut;
          ctx.translate(0, (1 - headIn) * 18);
          ctx.font = `800 38px ${FONT_SANS}`;
          ctx.fillStyle = '#0f172a';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('118 种元素，尽在眼前。', W / 2, 655);
          ctx.restore();
        }

        const pb = drawPromptBar(W / 2, 815, 1080, 'H', 'High');

        // At Bar 2.5 (t = 4.84s, Beat 10), cursor clicks Hydrogen pill -> Periodic Table modal pops open!
        const clickBar = 2.45;
        const modalProg = springPop(invLerp(clickBar, clickBar + 0.48, localBar));
        if (modalProg > 0.01) {
          ctx.save();
          const mx = 405, my = 152, mw = 1110, mh = 620;
          ctx.translate(W / 2, my + mh);

          drawPeriodicTableModal({ x: mx, y: my, w: mw, h: 740, activeSym: 'H', thinking: 'High', showPopover: false });
          ctx.restore();

        // Animated cursor gliding in from Bar 1.8 -> clicking pb.pillCx, pb.pillCy at Bar 2.45
        if (localBar >= 1.75) {
          const moveP = easeInOutCubic(invLerp(1.75, 2.38, localBar));
          const curX = lerp(pb.pillCx + 240, pb.pillCx + 18, moveP);
          const curY = lerp(pb.pillCy + 110, pb.pillCy + 4, moveP);
          const clickPulse = invLerp(clickBar - 0.05, clickBar + 0.12, localBar);
          const ripple = localBar >= clickBar ? invLerp(clickBar, clickBar + 0.35, localBar) : -1;
          drawCursor(curX, curY, clickPulse < 1 ? clickPulse : 0, ripple, '#3b82f6');
        }

        ctx.restore();

        drawPeriodicTableModal({
          x: 1000,
          y: 96,
          w: 840,
          h: 660,
          activeSym: 'Ar',
          thinking: 'High',
          showPopover: false,
        });

        // Overlapping crisp foreground Popover Card (center-right, just like the Pixel Cat speed card in ref cover!)
        const fx = 932, fy = 424, fw = 468, fh = 286;
        fillCard(fx, fy, fw, fh, 26, '#ffffff', 'rgba(15,23,42,0.10)', 0.16, 28, 68);
        ctx.beginPath();
        ctx.arc(fx + 38, fy + 46, 7, 0, Math.PI * 2);
        ctx.fillStyle = '#14b8a6';
        ctx.fill();
        ctx.font = `800 26px ${FONT_SANS}`;
        ctx.fillStyle = '#0f172a';
        ctx.textAlign = 'left';
        ctx.fillText('Gemini 4 Argon', fx + 56, fy + 46);
        ctx.font = `700 16px ${FONT_MONO}`;
        ctx.fillStyle = '#0f766e';
        ctx.textAlign = 'right';
        ctx.fillText('#18 Ar · 氩', fx + fw - 34, fy + 46);

        ctx.font = `500 18px ${FONT_SANS}`;
        ctx.fillStyle = '#475569';
        ctx.textAlign = 'left';
        ctx.fillText('Code and analysis · 代码工程与严谨分析', fx + 34, fy + 92);

        const segX = fx + 32, segY = fy + 132, segW = fw - 64, segH = 62;
        rr(segX, segY, segW, segH, 16);
        ctx.fillStyle = '#f1f5f9';
        ctx.fill();
        ['Low', 'Medium', 'High', 'XHigh'].forEach((lv, idx) => {
          const iw = (segW - 12) / 4;
          const lx = segX + 6 + idx * iw;
          const isAct = lv === 'High';
          if (isAct) {
            fillCard(lx, segY + 6, iw, segH - 12, 11, '#115e59', '#2dd4bf', 0.12, 6, 14);
          }
          ctx.font = `${isAct ? 700 : 600} 17px ${FONT_SANS}`;
          ctx.fillStyle = isAct ? '#ffffff' : '#475569';
          ctx.textAlign = 'center';
          ctx.fillText(lv, lx + iw / 2, segY + segH / 2);
        });

        ctx.font = `600 15px ${FONT_MONO}`;
        ctx.fillStyle = '#64748b';
        ctx.textAlign = 'left';
        ctx.fillText('gemini-4-argon-high', fx + 34, fy + 242);
        ctx.fillStyle = '#0f766e';
        ctx.textAlign = 'right';
        ctx.fillText('Alt + P 一键呼出', fx + fw - 34, fy + 242);

        // Bottom floating inline pill bar
        const bx = 932, by = 742, bw = 640, bh = 82;
        fillCard(bx, by, bw, bh, 22, '#ffffff', '#93c5fd', 0.12, 18, 44);
        rr(bx + 18, by + 18, 132, 46, 14);
        ctx.fillStyle = '#eff6ff';
        ctx.fill();
        ctx.font = `700 17px ${FONT_SANS}`;
        ctx.fillStyle = '#1d4ed8';
        ctx.textAlign = 'center';
        ctx.fillText('对话栏内嵌', bx + 84, by + 41);

        ctx.font = `700 18px ${FONT_SANS}`;
        ctx.fillStyle = '#0f172a';
        ctx.textAlign = 'left';
        ctx.fillText('● Argon · High ⌄    ✦ 118 元素    ⚡ 零外部依赖', bx + 172, by + 41);
        ctx.restore();
      }

      window.PROMO_META = { width: W, height: H, fps: 60, duration: DURATION, bpm: BPM };
      window.renderPromoFrame = drawTimelineAt;
      window.renderCoverFrame = renderCover;

      // Default interactive preview if opened manually in browser (not driven by headless capture)
      if (!location.search.includes('capture=1')) {
        let start = null;
        const tick = (now) => {
          if (!start) start = now;
          const elapsed = ((now - start) / 1000) % DURATION;
          drawTimelineAt(elapsed);
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }
    })();
  </script>
</body>
</html>
