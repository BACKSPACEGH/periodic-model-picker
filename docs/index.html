<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gemini 4 · Model Periodic Table</title>
  <script src="./periodic-table-data.js"></script>
  <script src="./periodic-table-widget.js"></script>
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: #0d0f13;
      color: #e8eaed;
      font-family: 'Google Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
    }

    .scene {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 13vh 18px 48px;
      background:
        radial-gradient(ellipse 680px 440px at 50% 38%, rgba(56, 108, 214, 0.16), transparent 70%),
        #0d0f13;
    }

    .top-badge {
      position: fixed;
      top: 16px;
      right: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #9aa0a6;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px 12px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
    }

    .hero-question {
      font-size: clamp(28px, 4vw, 38px);
      font-weight: 400;
      color: #f1f3f4;
      letter-spacing: -0.02em;
      margin: 0 0 28px;
      text-align: center;
    }

    /* Exact Ask Gemini Bar from Reference Video */
    .ask-bar {
      width: 100%;
      max-width: 720px;
      height: 58px;
      background: #1b1d22;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      padding: 0 14px 0 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 36px rgba(0, 0, 0, 0.45);
      transition: border-color 0.16s ease;
    }

    .ask-bar:focus-within {
      border-color: rgba(138, 180, 248, 0.4);
    }

    .plus-btn {
      appearance: none;
      background: transparent;
      border: none;
      color: #c4c7c5;
      font-size: 24px;
      font-weight: 300;
      padding: 0;
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .ask-input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: #f1f3f4;
      font-size: 16px;
      font-family: inherit;
    }

    .ask-input::placeholder {
      color: #9aa0a6;
    }

    .model-trigger {
      appearance: none;
      background: #282a30;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #e8eaed;
      height: 38px;
      padding: 0 15px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
      white-space: nowrap;
    }

    .model-trigger:hover {
      background: #31343c;
      border-color: rgba(255, 255, 255, 0.18);
    }

    .coming-circle {
      width: 6.5px;
      height: 6.5px;
      border-radius: 50%;
      border: 1.4px solid #9aa0a6;
      display: inline-block;
    }

    .trigger-chevron {
      width: 13px;
      height: 13px;
      opacity: 0.85;
      transition: transform 0.18s ease;
    }

    .model-trigger.is-open .trigger-chevron {
      transform: rotate(180deg);
    }

    .mic-btn {
      appearance: none;
      background: transparent;
      border: none;
      color: #c4c7c5;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .mic-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #ffffff;
    }

    /* Mode Tabs: Chat | Task */
    .mode-switch {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 20px 0 28px;
    }

    .mode-pill {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: #9aa0a6;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      padding: 8px 18px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .mode-pill.is-active {
      background: #23262d;
      border-color: rgba(255, 255, 255, 0.08);
      color: #f1f3f4;
    }

    /* Prompt Suggestions */
    .suggestions {
      width: 100%;
      max-width: 660px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .suggestion-row {
      appearance: none;
      background: transparent;
      border: none;
      color: #d2d5db;
      font-size: 15px;
      font-family: inherit;
      padding: 13px 14px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      text-align: left;
      transition: background 0.14s ease;
    }

    .suggestion-row:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .suggestion-icon {
      color: #9aa0a6;
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="top-badge">
    <span>✦</span>
    <span>Interactive Demo · Click the model pill or press <b>Alt + P</b></span>
  </div>

  <main class="scene">
    <h1 class="hero-question">Where should we start?</h1>

    <div class="ask-bar" id="askBar">
      <button type="button" class="plus-btn" aria-label="Add attachment">+</button>
      <input type="text" class="ask-input" id="askInput" placeholder="Ask Gemini" autocomplete="off" />
      <button type="button" class="model-trigger" id="modelTrigger">
        <span id="modelTriggerLabel">Hydrogen</span>
        <svg class="trigger-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
      <button type="button" class="mic-btn" aria-label="Use microphone">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="22"></line>
        </svg>
      </button>
    </div>

    <div class="mode-switch">
      <button type="button" class="mode-pill is-active">Chat</button>
      <button type="button" class="mode-pill">Task</button>
    </div>

    <div class="suggestions">
      <button type="button" class="suggestion-row">
        <svg class="suggestion-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        <span>What subject am I closest to mastering?</span>
      </button>
      <button type="button" class="suggestion-row">
        <svg class="suggestion-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Test AI response speed</span>
      </button>
      <button type="button" class="suggestion-row">
        <svg class="suggestion-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        <span>Reset my focus in 5 minutes</span>
      </button>
    </div>
  </main>

  <script>
    (function () {
      const askBar = document.getElementById('askBar');
      const askInput = document.getElementById('askInput');
      const modelTrigger = document.getElementById('modelTrigger');
      const modelTriggerLabel = document.getElementById('modelTriggerLabel');

      const widget = new window.GeminiPeriodicTableWidget.PeriodicTableWidget({
        mode: 'modal',
        platform: 'gemini',
        mountTarget: document.body,
        useShadowDom: true,
        initialState: {
          selectedType: 'element',
          selectedSymbol: 'H',
          thinkingBySymbol: { H: 'Medium', C: 'Low', Ne: 'High', Ar: 'Low' },
        },
        onSelect: (sel) => {
          if (sel.comingSoon) {
            modelTriggerLabel.innerHTML = `<span class="coming-circle"></span> ${sel.pillLabel}`;
          } else {
            modelTriggerLabel.textContent = sel.pillLabel;
          }
        },
        onOpenChange: (isOpen) => {
          modelTrigger.classList.toggle('is-open', isOpen);
        },
      });

      modelTrigger.addEventListener('click', (e) => {
        e.stopPropagation();
        widget.toggle(askBar.getBoundingClientRect());
      });

      window.addEventListener('resize', () => {
        if (widget.state.isOpen) {
          widget.positionModal(askBar.getBoundingClientRect());
        }
      });

      window.addEventListener('keydown', (e) => {
        if (e.altKey && !e.ctrlKey && !e.metaKey && e.code === 'KeyP') {
          e.preventDefault();
          widget.toggle(askBar.getBoundingClientRect());
        }
      });

      document.querySelectorAll('.mode-pill').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.mode-pill').forEach((b) => b.classList.remove('is-active'));
          btn.classList.add('is-active');
        });
      });

      document.querySelectorAll('.suggestion-row').forEach((btn) => {
        btn.addEventListener('click', () => {
          askInput.value = btn.querySelector('span').textContent;
          askInput.focus();
        });
      });
    })();
  </script>
</body>
</html>
