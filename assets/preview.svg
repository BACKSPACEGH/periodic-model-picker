<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" fill="none">
  <defs>
    <radialGradient id="glow" cx="50%" cy="22%" r="58%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0d0f13" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#669df6"/>
      <stop offset="55%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" rx="20" fill="#0d0f13"/>
  <rect width="960" height="540" rx="20" fill="url(#glow)"/>

  <!-- Top Ask Gemini Composer -->
  <text x="480" y="54" text-anchor="middle" fill="#f1f3f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="400">Where should we start?</text>

  <rect x="170" y="74" width="620" height="50" rx="25" fill="#1b1d22" stroke="#30343d" stroke-width="1"/>
  <text x="196" y="105" fill="#c4c7c5" font-family="-apple-system, sans-serif" font-size="22" font-weight="300">+</text>
  <text x="224" y="104" fill="#9aa0a6" font-family="-apple-system, sans-serif" font-size="15">Ask Gemini</text>
  <rect x="642" y="83" width="102" height="32" rx="16" fill="#2c233d" stroke="#a86af9" stroke-width="1.2"/>
  <text x="683" y="103" text-anchor="middle" fill="#f3e8ff" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">Carbon</text>
  <path d="M722 101 L726 97 L730 101" stroke="#e8eaed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="765" cy="99" r="3" fill="#9aa0a6"/>

  <!-- Periodic Table Surface -->
  <rect x="48" y="138" width="864" height="378" rx="18" fill="#1a1b1f" stroke="#2d3039" stroke-width="1.2"/>

  <!-- Header -->
  <path d="M76 160 C77 166, 81 170, 87 171 C81 172, 77 176, 76 182 C75 176, 71 172, 65 171 C71 170, 75 166, 76 160 Z" fill="url(#sp)"/>
  <text x="96" y="176" fill="#f1f3f4" font-family="-apple-system, sans-serif" font-size="15" font-weight="500">Model periodic table</text>
  <text x="884" y="176" fill="#9aa0a6" font-family="-apple-system, sans-serif" font-size="15">✕</text>

  <!-- Center Gemini 4 Title -->
  <text x="234" y="254" fill="#f1f3f4" font-family="-apple-system, sans-serif" font-size="26" font-weight="500">Gemini 4</text>
  <circle cx="238" cy="272" r="3" fill="#669df6"/>
  <text x="247" y="276" fill="#9aa0a6" font-family="-apple-system, sans-serif" font-size="11.5">3 released</text>
  <circle cx="322" cy="272" r="3" stroke="#80868b" stroke-width="1.3"/>
  <text x="331" y="276" fill="#9aa0a6" font-family="-apple-system, sans-serif" font-size="11.5">Coming soon</text>

  <!-- Highlighted Tiles: 1 H, 6 C, 18 Ar, plus sample periodic grid -->
  <!-- H (1,1) -->
  <rect x="74" y="198" width="40" height="36" rx="6" fill="#1c3352" stroke="#4f92ff" stroke-width="1.5"/>
  <text x="79" y="208" fill="#8ab8ff" font-family="-apple-system, sans-serif" font-size="8.5">1</text>
  <text x="94" y="224" text-anchor="middle" fill="#eef5ff" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="600">H</text>

  <!-- He (1,18) -->
  <rect x="854" y="198" width="40" height="36" rx="6" fill="#23252b" stroke="#30333b"/>
  <text x="859" y="208" fill="#7c818a" font-family="-apple-system, sans-serif" font-size="8.5">2</text>
  <text x="874" y="224" text-anchor="middle" fill="#c4c7c5" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">He</text>

  <!-- Li, Be -->
  <rect x="74" y="238" width="40" height="36" rx="6" fill="#23252b" stroke="#30333b"/>
  <text x="94" y="264" text-anchor="middle" fill="#c4c7c5" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Li</text>
  <rect x="120" y="238" width="40" height="36" rx="6" fill="#23252b" stroke="#30333b"/>
  <text x="140" y="264" text-anchor="middle" fill="#c4c7c5" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Be</text>

  <!-- B, C (purple!), N, O, F, Ne -->
  <rect x="624" y="238" width="40" height="36" rx="6" fill="#23252b" stroke="#30333b"/>
  <text x="644" y="264" text-anchor="middle" fill="#c4c7c5" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">B</text>

  <rect x="670" y="238" width="40" height="36" rx="6" fill="#332249" stroke="#a86af9" stroke-width="1.6"/>
  <text x="675" y="248" fill="#d2afff" font-family="-apple-system, sans-serif" font-size="8.5">6</text>
  <circle cx="704" cy="244" r="2.3" fill="#dbbfff"/>
  <text x="690" y="264" text-anchor="middle" fill="#f6edff" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700">C</text>

  <rect x="716" y="238" width="40" height="36" rx="6" fill="#23252b" stroke="#30333b"/>
  <text x="736" y="264" text-anchor="middle" fill="#c4c7c5" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">N</text>
  <rect x="762" y="238" width="40" height="36" rx="6" fill="#23252b" stroke="#30333b"/>
  <text x="782" y="264" text-anchor="middle" fill="#c4c7c5" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">O</text>
  <rect x="808" y="238" width="40" height="36" rx="6" fill="#23252b" stroke="#30333b"/>
  <text x="828" y="264" text-anchor="middle" fill="#c4c7c5" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">F</text>
  <rect x="854" y="238" width="40" height="36" rx="6" fill="#23252b" stroke="#30333b"/>
  <text x="874" y="264" text-anchor="middle" fill="#c4c7c5" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Ne</text>

  <!-- Row 3: Na, Mg ... Al, Si, P, S, Cl, Ar (teal!) -->
  <rect x="74" y="278" width="40" height="36" rx="6" fill="#23252b" stroke="#30333b"/>
  <text x="94" y="304" text-anchor="middle" fill="#c4c7c5" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Na</text>
  <rect x="120" y="278" width="40" height="36" rx="6" fill="#23252b" stroke="#30333b"/>
  <text x="140" y="304" text-anchor="middle" fill="#c4c7c5" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Mg</text>

  <rect x="624" y="278" width="40" height="36" rx="6" fill="#23252b" stroke="#30333b"/>
  <text x="644" y="304" text-anchor="middle" fill="#c4c7c5" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Al</text>
  <rect x="670" y="278" width="40" height="36" rx="6" fill="#23252b" stroke="#30333b"/>
  <text x="690" y="304" text-anchor="middle" fill="#c4c7c5" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Si</text>
  <rect x="716" y="278" width="40" height="36" rx="6" fill="#23252b" stroke="#30333b"/>
  <text x="736" y="304" text-anchor="middle" fill="#c4c7c5" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">P</text>
  <rect x="762" y="278" width="40" height="36" rx="6" fill="#23252b" stroke="#30333b"/>
  <text x="782" y="304" text-anchor="middle" fill="#c4c7c5" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">S</text>
  <rect x="808" y="278" width="40" height="36" rx="6" fill="#23252b" stroke="#30333b"/>
  <text x="828" y="304" text-anchor="middle" fill="#c4c7c5" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Cl</text>

  <rect x="854" y="278" width="40" height="36" rx="6" fill="#163b39" stroke="#2dd4bf" stroke-width="1.6"/>
  <text x="859" y="288" fill="#6ee7d8" font-family="-apple-system, sans-serif" font-size="8.5">18</text>
  <text x="874" y="304" text-anchor="middle" fill="#e6fffb" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700">Ar</text>

  <!-- Rows 4-6 decorative grid strip -->
  <g fill="#23252b" stroke="#30333b">
    <rect x="74" y="318" width="820" height="34" rx="6" fill-opacity="0.72"/>
    <rect x="74" y="356" width="820" height="34" rx="6" fill-opacity="0.72"/>
    <rect x="74" y="394" width="820" height="34" rx="6" fill-opacity="0.72"/>
    <rect x="212" y="440" width="682" height="30" rx="6" fill-opacity="0.55"/>
  </g>
  <text x="484" y="340" text-anchor="middle" fill="#8b909a" font-family="-apple-system, sans-serif" font-size="12">Full 118 IUPAC Elements · K  Ca  Sc  Ti  V  Cr  Mn  Fe  Co  Ni  Cu  Zn  Ga  Ge  As  Se  Br  Kr</text>
  <text x="484" y="378" text-anchor="middle" fill="#8b909a" font-family="-apple-system, sans-serif" font-size="12">Rb  Sr  Y  Zr  Nb  Mo  Tc  Ru  Rh  Pd  Ag  Cd  In  Sn  Sb  Te  I  Xe</text>
  <text x="484" y="416" text-anchor="middle" fill="#8b909a" font-family="-apple-system, sans-serif" font-size="12">Cs  Ba  [57–71]  Hf  Ta  W  Re  Os  Ir  Pt  Au  Hg  Tl  Pb  Bi  Po  At  Rn</text>
  <text x="553" y="459" text-anchor="middle" fill="#787d86" font-family="-apple-system, sans-serif" font-size="11">Ln (La–Lu) &amp; An (Ac–Lr) · Older &amp; Other Models</text>

  <!-- Floating Popover Card for Gemini 4 Carbon -->
  <rect x="520" y="108" width="268" height="122" rx="16" fill="#22242a" stroke="#454957" stroke-width="1.2"/>
  <rect x="536" y="122" width="44" height="44" rx="10" fill="#332249" stroke="#a86af9" stroke-width="1.5"/>
  <text x="542" y="134" fill="#d2afff" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600">6</text>
  <text x="558" y="153" text-anchor="middle" fill="#f6edff" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">C</text>
  <text x="592" y="141" fill="#f1f3f4" font-family="-apple-system, sans-serif" font-size="14.5" font-weight="600">Gemini 4 Carbon</text>
  <text x="592" y="158" fill="#9aa0a6" font-family="-apple-system, sans-serif" font-size="12">Most complex work</text>

  <text x="536" y="184" fill="#9aa0a6" font-family="-apple-system, sans-serif" font-size="11.5">Thinking level</text>
  <rect x="536" y="191" width="236" height="28" rx="14" fill="#1a1c21" stroke="#363944"/>
  <text x="575" y="209" text-anchor="middle" fill="#c4c7c5" font-family="-apple-system, sans-serif" font-size="11.5">Low</text>
  <text x="654" y="209" text-anchor="middle" fill="#c4c7c5" font-family="-apple-system, sans-serif" font-size="11.5">Medium</text>
  <rect x="694" y="194" width="75" height="22" rx="11" fill="#432b63" stroke="#a86af9" stroke-opacity="0.5"/>
  <text x="731" y="209" text-anchor="middle" fill="#eeddff" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">High</text>
</svg>
